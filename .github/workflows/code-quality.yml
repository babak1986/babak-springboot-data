# .github/workflows/code-quality.yml
name: Code Quality Check

on: [push, pull_request]

jobs:
  check-code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Run Checks
        run: mvn verify
